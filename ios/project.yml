name: Expensive
options:
  bundleIdPrefix: com.itsbypranav
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Expens***"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
targets:
  Expensive:
    type: application
    platform: iOS
    sources: [Expensive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsbypranav.expensive
        INFOPLIST_FILE: Expensive/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ExpensiveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExpensiveTests]
    dependencies:
      - target: Expensive
schemes:
  Expensive:
    build:
      targets:
        Expensive: all
        ExpensiveTests: [test]
    test:
      targets: [ExpensiveTests]
